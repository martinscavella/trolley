<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Trolley</title>
  <style>
    :root { --sfondo: #f7f5f1; --testo: #1d1b18; --attenuato: #6b665e; }
    @media (prefers-color-scheme: dark) {
      :root { --sfondo: #141312; --testo: #f1eee8; --attenuato: #a39d93; }
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--sfondo);
      color: var(--testo);
      font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    p { color: var(--attenuato); margin: 8px 0 0; }
  </style>
</head>
<body>
  <main>
    <h1>Trolley</h1>
    <p>Un viaggio dall'idea al ritorno. In prova privata.</p>
  </main>
</body>
</html>
