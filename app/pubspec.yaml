name: trolley
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  adaptive_platform_ui: ^1.0.1
  app_links: ^7.2.1
  connectivity_plus: ^7.3.1
  cunning_document_scanner: ^3.0.3
  cupertino_icons: ^2.0.0
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_localizations:
    sdk: flutter
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  supabase_flutter: ^2.18.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1
  http: ^1.6.0

flutter:
  uses-material-design: true
  assets:
    # Paesi e città per scegliere la destinazione, anche senza rete (ADR-005).
    # Si rigenera con tool/genera_destinazioni.dart.
    - assets/destinazioni.tsv

  # I caratteri della tela di Claude Design (CLAUDE.md, regola 9), dentro l'app
  # perché valgano anche senza rete. Licenza SIL OFL 1.1, accanto ai file.
  # Unbounded è variabile: il peso si dà con fontVariations (aspetto/testi.dart),
  # come fa il browser della tela.
  fonts:
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded.ttf
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
